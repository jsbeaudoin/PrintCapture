#NOTE 1: This value may be overwritten by corresponding
#API functions. See documentation.

[Parameters]
#Enables USB initialization log file
#values: 1=true | 0=false (default)
EnableUsbInitLogging=0

#84d only: Enables bulk 1024 USB transfer (less FIFO overflows at high framerates but out of USB2.0 spec.) 
#values: 0=forced off | 1=auto detect (default) | 2=forced on
EnableBulk1024Transfer=1

#Enables an image enhancement feature that helps to improve the
#details of ridges and valleys in case of dry/hard finger skin
#values: 1=true (default) | 0=false 
#see NOTE 1
EnableDrySkinImgEnhance=1

#84d only: Enables the automatic management of CPU IDLE feature (Windows only).
#Newer CPU with USB3.0 controller, expecially in laptops, may loose USB data if power saving features are active.
#Enabling this feature, during acquisition, power saving will be temporary disabled preventing data loss.
#Do NOT use this feature together with GBMSAPI (SDK) since it may interfer.
#values: 1=true | 0=false (default)
#see NOTE 1
EnableCpuIdleManagement=1

############################################################################################
#VER2000
#CAUTION: When connected to a USB2.0 port, using an high framerate may lead to errors
#(eg. "Communication error" and/or "Device not responding") due intensive USB traffic.
#84d only: In this case could be useful to enable bulk 1024 USB transfer
#(EnableBulk1024Transfer=1 see above)
#
#NOTE: USB2_XXX default framerate values will be automatically applied in case of 
#USB2.0 connection, USB3_XXX in case of USB3.0 connection (84v only).

#Default value for Full Frame Low Resolution (preview) framerate
#range: min 1.0 - 8.0 (best for USB2.0) - max 15.0 (best for USB3.0)
#see NOTE 1 
USB2_DefaultFFLRFrameRate=8.0
USB3_DefaultFFLRFrameRate=15.0

#Default value for Full Frame (flat) framerate
#range: min 0.3 - 4.0 (best for USB2.0) - max 8.4 (best for USB3.0)
#see NOTE 1
USB2_DefaultFFFrameRate=4.0
USB3_DefaultFFFrameRate=8.4

#Default value for Partial Frame (roll) framerate
#range: min 0.5 - 12.0 (best for USB2.0) - max 24.0 (best for USB3.0)
#see NOTE 1 
USB2_DefaultPFFrameRate=12.0
USB3_DefaultPFFrameRate=24.0









