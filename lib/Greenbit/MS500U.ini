[Parameters]
#Enables USB initialization log file
#values: 1=true | 0=false (default)
EnableUsbInitLogging=0

#Enables bulk 1024 USB transfer (less FIFO overflows at high framerates but out of USB2.0 spec.) 
#values: 0=forced off | 1=auto detect (default) | 2=forced on
EnableBulk1024Transfer=1

#Timeout in seconds for FLASH memory erase (useful for bigger-than-requested flash chips)
#default: 600
#FlashTimeoutErase=600

#CAUTION: using ForcePreviewHiSpeed on a scanner that doesn't support it (eg. MS500 or old MC500)
#causes malfunctioning
#values: 1=true | 0=false (default)
#ForcePreviewHiSpeed=1
#ForcePreviewHiResolution=1
