[IDLEDISABLE]
#This parameter is available starting from GBMSAPI.DLL version 4.3.0.0. 
#GBMSAPI.DLL provides the possibility to disable CPU IDLE STATES before image acquisition start.
#When disabled by the GBMSAPI.DLL, CPU IDLE STATES are restored at the end of the acquisition.
#This feature is available for some USB 2.0 devices only, whose list is: DID20, DS40i, DS40p, 
#DS32, DS32p, DS84c, DS84C_V2, MC517, MS527, DS26(i). For USB 3.0 devices (DS84t, MS527t and
#so on) this feature is not needed.
#
#To control this feature uncomment the "IDLEDISABLE_ActivateFeature_USB20=..." line
#and use the following values:
#
# <feature>=0 => (Default value) the GBMSAPI will use internal default behaviour (
#	that is, cpu idle disable)
# <feature>=1 => The idle policy will be ruled by the operating system
# <feature>=2 => The idle states will be disabled forcedly
#
#This is valid for WINDOWS VISTA version and higher. Earlier WINDOWS OS versions do not support this mechanism.
#IDLEDISABLE_ActivateFeature_USB20=0

[LogSettings]
#This setting tells the GBMSAPI library whether to log (LogOnFile=1) or not (LogOnFile=0) on file.
#The generated file name will be formatted as follows:
#GBMSAPI_Log_d-<yy>-<MM>-<dd>_h-<hh>-<mm>-<ss>.log
#where:
#	- <yy>-<MM>-<dd> is the log date (year-month-day)
#	- <hh>-<mm>-<ss> is the log time (hour-minute-second)
#
#Default: LogOnFile=0
LogOnFile=0
#This setting item tells the GBMSAPI library whether to overwrite the last session log file
#	(LogDeleteOld = 1) or not (LogDeleteOld = 0)
#Default: LogDeleteOld = 1
LogDeleteOld=1

