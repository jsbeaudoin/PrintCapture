[FfdMembraneSettings]
#The settings in this section declare to the fake finger algorithm that a membrane is being used for 
#fingerprint scanning.
#The following settings shall be used:
#
#	SW_FFD_membrane_ScannerModel -> a list of scanner models separated by a ";": if the model of the currently
#		attached device model matchs with one of the models specified into the list, then the setting will be 
#		considered as TRUE.
#	SW_FFD_membrane_ScannerSN -> a list of scanner serial numbers separated by a ";": if the serial number of
#		the currently attached device matchs with one of the serial numbers specified into the list, then the
#		setting will be considered as TRUE.
#
#The global setting calculated by using the GBMSAPI.ini file shall be the logical OR of the values calculated
#from the "SW_FFD_membrane_ScannerModel" and "SW_FFD_membrane_ScannerSN" settings.
#If neither setting is found or the .ini file itself is not found, the settings will be considered as FALSE.

#This setting tells the GBMSAPI library that all the scanners of the models specified into the
#list passed as setting value that are connected to the usb are provided with a membrane.
#
#For further details about the meaning and how it will be used into the GBMSAPI library, look
#at the "GBMSAPI_SetMembraneUsageForFakeFingerDetection" function in the "GBMSAPI_Library.h" file.
#
#It shall be composed by a list of scanner models separated by a semicolon (';') character or by a 
#single dot ('.') character (default) in case of empty list. Max 20 device types can be
#included in this setting.
#Each item of the list can assume values one of the following values:
#
#	"DS84C" -> indicates that all the DS84C devices attached to the USB bus have a membrane
#	"DS84t" -> indicates that all the DS84t devices attached to the USB bus have a membrane
#	"CS500f" -> indicates that all the CS500f devices attached to the USB bus have a membrane
#	"DS84C_V2" -> indicates that all the DS84C_V2 devices attached to the USB bus have a membrane
#	"DS84t_V2" -> indicates that all the DS84t_V2 devices attached to the USB bus have a membrane
#	"CS500f_V2" -> indicates that all the CS500f_V2 devices attached to the USB bus have a membrane
#
#NOTE: do not use characters other than '.', ';' and the characters that compose the device types,
#otherwise the setting will be considered not valid.
#
#Usage example:
#SW_FFD_membrane_ScannerModel=DS84C;DS84t;CS500f;DS84C_V2;DS84t_V2;CS500f_V2
#
SW_FFD_membrane_ScannerModel=.
#This setting specifies the serial number of the scanners that are actually provided with the membrane.
#
#For further details about the meaning and how it will be used into the GBMSAPI library, look
#at the "GBMSAPI_SetMembraneUsageForFakeFingerDetection" function in the "GBMSAPI_Library.h" file.
#
#It shall be composed by a list of scanner serial numbers separated by a semicolon (';') character or by a 
#single dot ('.') character (default) in case of empty list. Max 10 device serial numbers can be
#included in this setting.
#
#Usage example:
#SW_FFD_membrane_ScannerSN=C8R1RP000001;C8R1RP000002;C8R1RP000003
#
SW_FFD_membrane_ScannerSN=.
