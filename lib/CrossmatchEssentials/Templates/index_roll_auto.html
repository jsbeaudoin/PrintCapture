<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
<meta http-equiv="Content-type" content="text/html; charset=utf-8" />
<title>Guardian User Interface Rolled Finger Test</title>
<link href="css/style.css" rel="stylesheet" type="text/css" />

  <script language="JavaScript" type="text/JavaScript">
	/***********************************************************************************************
		This web page will use JavaScript to demonstrates the img/image_roll.svg image.

		The body of this web page is at the bottom of this file.
		The javascript will parse the html arguments and load the svg images.
		The svg images use ecmascript to perform the image animation.
	************************************************************************************************/

	var myArgs = {"Result":0,"ButtonRetry":0,"ButtonConfirm":0,"HP0":0,"HP1":0,"FP1":0,"FP2":0,"FP3":0,"FP4":0,"FP5":0,"FP6":0,"FP7":0,"FP8":0,"FP9":0, "FP10":0};

	//parse URL, parse jason that contains the arguments. Save the new argName arguments into myArgs array.
	// SVG files will call this fuction via window.parent.parseUrlArguments();
	//parse URL, parse jason that contains the arguments. Save the new argName arguments into myArgs array.
	function parseUrlArguments() {
		try {
			var arr = window.location.href.split("?");
			if (arr.length == 2) {
				var jsonStr = decodeURI(arr[1])			// Get URI string
				var json= JSON.parse(jsonStr);			// parse each entry

				for ( var argName in json){
					this.myArgs[argName]= json[argName];	// Replace default argName with new URI arguments
				}
			}
		}
		catch (ex) {
			alert(ex);
		}
		return null;
	}
	
	
	// SVG file can call this fuction via window.parent.getArguments();
	// returns array of URI argument to SVG file for processing
	function getArguments() {
		return this.myArgs;
	}

	// Set arguments based on various standard "button" settings then generate a new SVG image
	function setArguments( newArgs) {
		try {
			for ( var argName in newArgs){ 
				myArgs[argName]= newArgs[argName];	// read new arguments
			}
			svgUpdate();		//Reload svg image according to arguments.
		}
		catch (ex) {
			alert(ex);
		}
		return myArgs;
	}

	// Allow call into the Update function in the SVG file 
	// Allow for refresh.
	function svgUpdate() {}


	//Reload svg according to arguments
	// svgReload can be called at any time if the web page with svg image needs to reloaded
	function svgReload() {
		var svgobj=document.getElementById('svg').getSVGDocument(); 
		if (svgobj) {
			svgobj.location.reload(true);
		}
	}



	function refreshSVG() {
		var newArgObj = {"HP2":1,"ButtonConfirm":1,"FP10":1,"FP9":1,"FP8":1,"FP7":1,"FP6":1,"HP1":1,"FP1":1,"FP2":2,"FP3":3,"FP4":4,"FP5":5,"Result":1,"ButtonRetry":2};
		
		//foreach each object
		Object.prototype.foreach = function( callback ) {
			for( var k in this ) {
				if(this.hasOwnProperty(k)) {
					callback( k, this[ k ] );
				}
			}
		}

		var i=0;
		newArgObj.foreach( function( arg, val ) {
			var tempArgObj = new Object();
			tempArgObj[arg] = val;
			setTimeout(setArguments,500*i, tempArgObj);
			i++;
		});

	}


   </script>

</head>
<body onload="refreshSVG()">
  <div class="page_margins">
    <div class="page">
      <div id="main">
      	<object id="svg" class="svgobj" type="image/svg+xml" data="img/image_roll.svg" width="100%" height="100%"></object>
      </div>
    </div>
  </div>
</body>
</html>
